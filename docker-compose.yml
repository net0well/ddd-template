services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: web-api
    build:
      context: .
      dockerfile: src/Web.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    environment:
      # Inside the compose network the database host is the service name, not localhost.
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=clean-architecture;Username=postgres;Password=postgres;Include Error Detail=true;GSS Encryption Mode=Disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      postgres:
        condition: service_healthy
      observability:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      - POSTGRES_DB=clean-architecture
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      # Named volume: database files outside the source tree (and out of OneDrive/Dropbox sync).
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clean-architecture"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics) + an OpenTelemetry
  # Collector, all bundled in one image. Open Grafana at http://localhost:3000.
  observability:
    image: grafana/otel-lgtm:0.29.1
    container_name: observability
    ports:
      - 3000:3000   # Grafana
      - 4317:4317   # OTLP gRPC
      - 4318:4318   # OTLP HTTP
    restart: unless-stopped

volumes:
  postgres-data:
