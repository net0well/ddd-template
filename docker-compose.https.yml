# Optional HTTPS (https://localhost:5001) with the ASP.NET Core development certificate.
#
# 1. Export the certificate once (set DEV_CERT_PASSWORD in .env to the same password):
#      dotnet dev-certs https -ep ~/.aspnet/https/aspnetapp.pfx -p <password>
#      dotnet dev-certs https --trust
# 2. Start with:
#      docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.https.yml up -d
services:
  web-api:
    ports:
      - 5001:8081
    environment:
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${DEV_CERT_PASSWORD:?Set DEV_CERT_PASSWORD in .env (see docker-compose.https.yml)}
    volumes:
      - ${DEV_CERT_DIR:-~/.aspnet/https}:/https:ro
